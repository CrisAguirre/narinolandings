<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: white; font-family: sans-serif; }
    svg { width: 100vw; height: 100vh; }
    .label {
      position: absolute;
      background: white;
      border: 1px solid black;
      padding: 2px 4px;
      font-size: 12px;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    fetch('/assets/1.svg').then(r => r.text()).then(svg => {
      document.getElementById('map').innerHTML = svg;
      
      const tspans = document.querySelectorAll('tspan');
      const paths = document.querySelectorAll('path');
      
      tspans.forEach(tspan => {
        const textBBox = tspan.getBoundingClientRect();
        const tx = textBBox.left + textBBox.width / 2;
        const ty = textBBox.top + textBBox.height / 2;
        
        let bestColor = 'none';
        let minDist = Infinity;
        
        // This is a naive geometric match, but we can visually verify it
        paths.forEach(p => {
          const style = p.getAttribute('style') || '';
          const fillMatch = style.match(/fill:\s*(#[0-9a-fA-F]{6})/i);
          const color = fillMatch ? fillMatch[1].toLowerCase() : 'none';
          
          if (color !== 'none' && color !== '#e1e1e1' && color !== '#f2f2f2' && color !== '#ffffff') {
            const pBBox = p.getBoundingClientRect();
            const px = pBBox.left + pBBox.width / 2;
            const py = pBBox.top + pBBox.height / 2;
            
            const dist = Math.hypot(tx - px, ty - py);
            if (dist < minDist) {
              minDist = dist;
              bestColor = color;
            }
          }
        });
        
        const div = document.createElement('div');
        div.className = 'label';
        div.style.left = tx + 'px';
        div.style.top = (ty + 20) + 'px';
        div.textContent = tspan.textContent.trim() + ' = ' + bestColor;
        document.body.appendChild(div);
      });
    });
  </script>
</body>
</html>
